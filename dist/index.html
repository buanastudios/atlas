<!DOCTYPE html>
<html lang="id" data-theme="dark" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="description" content="Atlas Edu — Islamic Education Management Super App by Buana Studios" />
  <title>Atlas Edu — Mobile Super App</title>

  <!-- Google Fonts & FontAwesome 6 Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- App Stylesheet (Directly linked for instant Vite compile & bundling) -->
  <script type="module" crossorigin src="/atlas/assets/index-Bz9qjcCL.js"></script>
  <link rel="stylesheet" crossorigin href="/atlas/assets/index-Bx2svQnW.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 flex items-center justify-center p-0 sm:p-4 selection:bg-emerald-500 selection:text-white font-sans antialiased">

  <!-- =========================================================================
       SMARTPHONE DEVICE HARDWARE SHELL
  ========================================================================== -->
  <div id="smartphone-wrapper" class="smartphone-container">
    
    <!-- ── TOP STATUS BAR / DYNAMIC ISLAND ──────────────────────────────── -->
    <header class="relative z-30 pt-3 px-6 pb-2 flex items-center justify-between text-xs font-semibold text-slate-300 select-none backdrop-blur-md bg-slate-950/60 border-b border-white/[0.04]">
      <!-- Time Display -->
      <span id="status-clock" class="tracking-tight font-bold text-slate-200">08:30</span>
      
      <!-- Dynamic Island / Camera Notch -->
      <div class="dynamic-island">
        <div class="island-camera"></div>
        <div class="island-sensor animate-pulse"></div>
      </div>

      <!-- Status Indicators -->
      <div class="flex items-center gap-2 text-[11px]">
        <i class="fas fa-signal text-slate-400"></i>
        <i class="fas fa-wifi text-slate-400"></i>
        <div class="flex items-center gap-1 text-emerald-400 font-bold">
          <span id="battery-level" class="text-[10px]">100%</span>
          <i class="fas fa-battery-full text-xs"></i>
        </div>
      </div>
    </header>

    <!-- ── MAIN SCROLLABLE VIEWPORT ─────────────────────────────────────── -->
    <main id="app-viewport" class="flex-1 overflow-y-auto hide-scrollbar px-4 pb-28 pt-3 space-y-4">
      
      <!-- View 1: Launcher Home Screen -->
      <section id="view-launcher" class="space-y-4">
        
        <!-- Header Profile & Search Widget -->
        <div class="glass-hero p-4 rounded-3xl relative overflow-hidden">
          <div class="flex items-center justify-between mb-3.5">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-emerald-950/60 text-white font-bold text-xl border border-white/20">
                <i class="fas fa-graduation-cap"></i>
              </div>
              <div>
                <div class="text-[10px] font-extrabold text-emerald-400 uppercase tracking-widest flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                  T.A. 2026/2027 · SD At-Tibyan
                </div>
                <h1 class="text-base font-extrabold text-white leading-tight">Atlas Edu Super App</h1>
              </div>
            </div>
            
            <!-- Quick Circuit Guard indicator -->
            <button id="btn-circuit-guard" title="Circuit Guard Status" class="w-9 h-9 rounded-2xl bg-slate-800/80 hover:bg-slate-700 text-emerald-400 border border-slate-700/60 flex items-center justify-center shadow transition active:scale-95">
              <i class="fas fa-shield-heart text-xs"></i>
            </button>
          </div>

          <!-- In-App Search Bar -->
          <div class="relative">
            <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input 
              id="launcher-search" 
              type="text" 
              placeholder="Cari modul (Halaqah, SPP, MBG, PPDB)..." 
              class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl py-2.5 pl-9 pr-4 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition shadow-inner"
            />
          </div>
        </div>

        <!-- Category Filter Tabs -->
        <div id="category-tabs" class="flex gap-1.5 overflow-x-auto hide-scrollbar py-1">
          <button data-cat="all" class="category-pill active">Semua</button>
          <button data-cat="Diniyah" class="category-pill">Diniyah</button>
          <button data-cat="Academic" class="category-pill">Akademik</button>
          <button data-cat="Finance" class="category-pill">Keuangan</button>
          <button data-cat="Operational" class="category-pill">Operasional</button>
          <button data-cat="Governance" class="category-pill">WTP & Audit</button>
        </div>

        <!-- 4-Column Smartphone App Grid -->
        <div id="app-grid" class="grid grid-cols-4 gap-y-4 gap-x-2 pt-1 pb-2">
          <!-- Populated dynamically by AppGrid.js -->
        </div>

        <!-- Daily Highlights & KPI Metric Cards -->
        <div class="grid grid-cols-2 gap-3 pt-1">
          <div class="glass-card p-3.5 rounded-2xl">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
              <span class="text-[11px] font-semibold text-slate-300">Presensi Santri</span>
              <i class="fas fa-check-circle text-emerald-400"></i>
            </div>
            <div class="text-xl font-black text-white">98.4%</div>
            <div class="text-[10px] text-emerald-400/90 font-medium mt-0.5">342/348 Santri Hadir</div>
          </div>
          <div class="glass-card p-3.5 rounded-2xl">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
              <span class="text-[11px] font-semibold text-slate-300">Program MBG</span>
              <i class="fas fa-utensils text-amber-400"></i>
            </div>
            <div class="text-xl font-black text-white">Diterima</div>
            <div class="text-[10px] text-emerald-400 font-medium mt-0.5">Uji Organoleptik Lolos ✓</div>
          </div>
        </div>

      </section>

      <!-- View 2: Live Activity Feed (Hidden by default) -->
      <section id="view-activity" class="hidden space-y-3">
        <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400 flex items-center gap-2 px-1">
          <i class="fas fa-bolt text-amber-400"></i> Log Aktivitas & Audit Trail
        </h2>
        <div id="activity-stream" class="space-y-2.5">
          <!-- Populated by ActivityFeed.js -->
        </div>
      </section>

      <!-- View 3: Profile / Digital ID Card (Hidden by default) -->
      <section id="view-profile" class="hidden space-y-4">
        <!-- Populated by ProfileView.js -->
      </section>

      <!-- View 4: System Settings (Hidden by default) -->
      <section id="view-settings" class="hidden space-y-4">
        <!-- Populated by SettingsView.js -->
      </section>

    </main>

    <!-- ── ACTIVE MODULE CONTAINER (SLIDE-OVER SHEET) ───────────────────── -->
    <div id="module-container" class="absolute inset-0 z-40 bg-slate-950 flex flex-col transform translate-y-full transition-transform duration-300 ease-out">
      <!-- Top Module Header -->
      <div class="px-4 py-3 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between backdrop-blur-xl">
        <div class="flex items-center gap-3">
          <button id="btn-close-module" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition active:scale-90">
            <i class="fas fa-arrow-left text-xs"></i>
          </button>
          <div>
            <h2 id="module-title" class="text-xs font-bold text-white leading-tight">Module Title</h2>
            <p id="module-category" class="text-[10px] text-emerald-400 font-medium">Category</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="btn-module-refresh" class="w-8 h-8 rounded-xl bg-slate-800/80 text-slate-300 hover:text-white flex items-center justify-center text-xs transition">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>
      </div>

      <!-- Scrollable Module Content -->
      <div id="module-body" class="flex-1 overflow-y-auto hide-scrollbar p-4 bg-slate-950 space-y-3">
        <!-- Dynamic module component injected here -->
      </div>
    </div>

    <!-- ── PERSISTENT GLASSMORPHIC BOTTOM DOCK ──────────────────────────── -->
    <nav class="absolute bottom-0 inset-x-0 z-30 px-4 py-2 glass-dock flex items-center justify-around safe-bottom">
      <button data-dock="launcher" class="dock-btn active">
        <div class="dock-icon-box">
          <i class="fas fa-th-large"></i>
        </div>
        <span class="text-[10px] font-bold">Beranda</span>
      </button>

      <button data-dock="activity" class="dock-btn">
        <div class="dock-icon-box">
          <i class="fas fa-bolt"></i>
        </div>
        <span class="text-[10px] font-bold">Aktivitas</span>
      </button>

      <button data-dock="profile" class="dock-btn">
        <div class="dock-icon-box">
          <i class="fas fa-id-card"></i>
        </div>
        <span class="text-[10px] font-bold">Kartu ID</span>
      </button>

      <button data-dock="settings" class="dock-btn">
        <div class="dock-icon-box">
          <i class="fas fa-sliders-h"></i>
        </div>
        <span class="text-[10px] font-bold">Pengaturan</span>
      </button>
    </nav>

  </div>

  <!-- Vite Main Script Entrypoint -->
</body>
</html>
