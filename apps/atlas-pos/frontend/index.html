<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas POS — Retail POS & Inventory Vertical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../atlas-eiam/frontend/assets/css/kit-theme.css">
</head>
<body class="bg-light">

    <header class="kit-header d-flex align-items-center justify-content-between px-4">
        <div class="d-flex align-items-center gap-2">
            <img src="assets/images/atlas-logo.svg" alt="Atlas Logo" style="height: 34px; width: auto;">
            <span class="fw-bold fs-5 text-dark">Atlas POS & Inventory</span>
            <span class="badge bg-success-subtle text-success">Commercial Vertical</span>
        </div>
        <div class="small text-muted">Powered by <strong>Buana Studios</strong></div>
    </header>

    <div class="container-fluid p-4">
        <div class="row g-4">
            <!-- Product Catalog Grid -->
            <div class="col-md-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0"><i class="fas fa-shopping-bag text-teal me-2"></i>Retail Product Catalog</h5>
                    <span class="text-muted small">Cross-Subsidy Ledger Enabled</span>
                </div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="kit-card p-3 text-center">
                            <div class="bg-light rounded p-3 mb-2"><i class="fas fa-book-open fs-1 text-primary"></i></div>
                            <h6 class="fw-bold text-dark mb-1">Textbooks & Books</h6>
                            <div class="text-teal fw-bold mb-2">Rp 45.000</div>
                            <button class="btn-kit-primary btn-sm w-100" onclick="addToCart('Textbooks & Books', 45000)">+ Add to Cart</button>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="kit-card p-3 text-center">
                            <div class="bg-light rounded p-3 mb-2"><i class="fas fa-tshirt fs-1 text-indigo"></i></div>
                            <h6 class="fw-bold text-dark mb-1">Batik Uniform Suite</h6>
                            <div class="text-teal fw-bold mb-2">Rp 120.000</div>
                            <button class="btn-kit-primary btn-sm w-100" onclick="addToCart('Batik Uniform Suite', 120000)">+ Add to Cart</button>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="kit-card p-3 text-center">
                            <div class="bg-light rounded p-3 mb-2"><i class="fas fa-pencil-ruler fs-1 text-warning"></i></div>
                            <h6 class="fw-bold text-dark mb-1">Stationery Set</h6>
                            <div class="text-teal fw-bold mb-2">Rp 25.000</div>
                            <button class="btn-kit-primary btn-sm w-100" onclick="addToCart('Stationery Set', 25000)">+ Add to Cart</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Checkout Terminal -->
            <div class="col-md-4">
                <div class="kit-card p-4">
                    <h6 class="fw-bold text-dark mb-3"><i class="fas fa-receipt text-indigo me-2"></i>Cashier Checkout Terminal</h6>
                    <div id="cart-items" class="mb-3" style="min-height: 140px;">
                        <p class="text-muted small text-center py-4">Shopping cart is empty.</p>
                    </div>
                    <div class="border-top pt-3 mb-3">
                        <div class="d-flex justify-content-between fw-bold text-dark fs-5">
                            <span>Total</span>
                            <span id="cart-total" class="text-teal">Rp 0</span>
                        </div>
                    </div>
                    <button class="btn-kit-primary w-100 py-2" onclick="checkoutCart()">Checkout & Print Receipt</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    let cart = [];
    function addToCart(name, price) {
        cart.push({ name, price });
        renderCart();
    }
    function renderCart() {
        const container = document.getElementById('cart-items');
        if (cart.length === 0) {
            container.innerHTML = '<p class="text-muted small text-center py-4">Shopping cart is empty.</p>';
            document.getElementById('cart-total').innerText = 'Rp 0';
            return;
        }
        let total = 0;
        container.innerHTML = cart.map(item => {
            total += item.price;
            return `<div class="d-flex justify-content-between small border-bottom py-2"><span>${item.name}</span><span class="fw-semibold">Rp ${item.price.toLocaleString('id-ID')}</span></div>`;
        }).join('');
        document.getElementById('cart-total').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }
    function checkoutCart() {
        if (cart.length === 0) return alert('Cart is empty!');
        alert('POS Transaction Successful! Outbox event dispatched to Transactional Outbox Engine.');
        cart = [];
        renderCart();
    }
    </script>
</body>
</html>
