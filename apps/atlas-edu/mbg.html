<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Makan Bergizi Gratis (MBG) — Atlas Edu by Buana Studios">
    <meta name="theme-color" content="#03ac0e">
    <title>Makan Bergizi Gratis (MBG) — Atlas Edu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/edu-theme.css">
    <link rel="stylesheet" href="assets/js/modules/mbg/style.css">
</head>
<body>

<header id="edu-main-header" class="tokopedia-super-header" style="display:none;">
    <div class="container-fluid d-flex align-items-center justify-content-between gap-3">

        <!-- Brand -->
        <a href="#" class="d-flex align-items-center gap-2 text-decoration-none flex-shrink-0">
            <div class="pwa-app-icon icon-gradient-green" style="width:32px;height:32px;font-size:14px;border-radius:9px;margin:0;">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <span class="fw-bold tracking-tight" style="font-size:17px;color:var(--text);">Atlas Edu</span>
        </a>

        <!-- Categorized Search (desktop) -->
        <div class="flex-grow-1 d-none d-md-block" style="max-width:580px;">
            <div class="tokopedia-search-box d-flex align-items-center">
                <select id="search-category" style="border:none;background:transparent;font-size:12px;font-weight:600;color:var(--muted);padding:0 8px 0 12px;outline:none;cursor:pointer;min-width:110px;border-right:1px solid var(--border);height:38px;">
                    <option value="all">All</option>
                    <option value="student">Student Name</option>
                    <option value="teacher">Teacher</option>
                    <option value="module">Module</option>
                    <option value="attendance">Attendance</option>
                    <option value="invoice">Invoice / SPP</option>
                    <option value="asset">Asset</option>
                </select>
                <input id="global-search-input" type="text" class="tokopedia-search-input flex-grow-1"
                       placeholder="Ketik kata kunci pencarian…"
                       oninput="EduSearch.run(this.value, document.getElementById('search-category').value)">
                <button onclick="EduSearch.run(document.getElementById('global-search-input').value, document.getElementById('search-category').value)" style="background:var(--green);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;padding:0 16px;height:36px;margin:2px;cursor:pointer;">Cari</button>
            </div>
        </div>

        <!-- Right actions -->
        <div class="d-flex align-items-center gap-2 flex-shrink-0">
            <!-- Unit Badge -->
            <div id="header-unit-badge" class="unit-identity-badge d-none d-lg-flex gap-2"></div>

            <!-- Rapor Digital button -->
            <button onclick="EduStudentLifecycle.openRaporDigitalModal()"
                    style="border-radius:20px;border:1.5px solid var(--teal);color:var(--teal);background:transparent;font-size:12px;font-weight:700;padding:7px 14px;cursor:pointer;white-space:nowrap;">
                <i class="fas fa-file-alt me-1"></i>Rapor Digital
            </button>

            <!-- Graduation & Ijazah quick link -->
            <a href="graduation.html"
                    style="border-radius:20px;border:1.5px solid #f59e0b;color:#d97706;background:#fffbe0;font-size:12px;font-weight:700;padding:7px 14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px;">
                <i class="fas fa-certificate"></i>Graduation &amp; Ijazah
            </a>

            <!-- WTP button -->
            <a href="governance.html"
                    style="border-radius:20px;border:1.5px solid var(--green);color:var(--green);background:transparent;font-size:12px;font-weight:700;padding:7px 14px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px;">
                <i class="fas fa-award"></i>WTP
            </a>

            <!-- Circuit Guard button -->
            <button onclick="AtlasFaultGuard.openHealthDashboardModal()"
                    style="border-radius:20px;border:1.5px solid #ef4444;color:#ef4444;background:#fef2f2;font-size:12px;font-weight:700;padding:7px 14px;cursor:pointer;white-space:nowrap;">
                <i class="fas fa-heartbeat me-1"></i>Circuit Guard
            </button>

            <!-- User email -->
            <span id="user-email-display" class="small text-muted d-none d-xl-inline"></span>

            <!-- LOG OUT BUTTON -->
            <button id="btn-logout"
                    onclick="EduLogin.logout()"
                    style="border-radius:8px;border:1.5px solid #fca5a5;color:#dc2626;background:#fff5f5;font-size:13px;font-weight:700;padding:8px 16px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;">
                <i class="fas fa-sign-out-alt"></i>
                <span class="d-none d-sm-inline">Log Out</span>
            </button>
        </div>
    </div>
</header>

<!-- LOGIN SCREEN — form injected by edu-login.js -->
<div id="screen-login" style="display:none;min-height:100vh;"></div>

<div id="app-viewport">
    <div id="module-mbg" class="px-3 px-md-4 pb-4">
        <div class="mt-3">
            <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
                <a href="dashboard.html" class="btn btn-outline-secondary btn-sm fw-bold">
                    <i class="fas fa-arrow-left me-1"></i>Kembali
                </a>
                <div class="flex-grow-1">
                    <h5 class="fw-bold mb-0">Makan Bergizi Gratis (MBG) Operations</h5>
                    <div style="font-size:12px;color:var(--muted);">Food Safety Organoleptic Audit &amp; Multi-Signoff Log</div>
                </div>
            </div>

            <!-- Reception Card -->
            <div class="kit-card p-4 mb-3">
                <h6 class="fw-bold mb-3"><i class="fas fa-utensils me-2 text-success"></i>Form Penerimaan &amp; Pengujian Organoleptik Makanan (FRM-MBG-01)</h6>
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold">Penyedia / Vendor Catering</label>
                        <input type="text" class="form-control" value="PT Berkah Boga Sejahtera (SPPG-001)">
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label small fw-bold">Jumlah Porsi Diterima</label>
                        <input type="number" class="form-control" value="350">
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-3">
                        <label class="form-label small fw-bold">Aroma (1-10)</label>
                        <input type="number" class="form-control" value="9">
                    </div>
                    <div class="col-3">
                        <label class="form-label small fw-bold">Tampilan (1-10)</label>
                        <input type="number" class="form-control" value="9">
                    </div>
                    <div class="col-3">
                        <label class="form-label small fw-bold">Rasa (1-10)</label>
                        <input type="number" class="form-control" value="9">
                    </div>
                    <div class="col-3">
                        <label class="form-label small fw-bold">Tekstur (1-10)</label>
                        <input type="number" class="form-control" value="9">
                    </div>
                </div>

                <button onclick="EduMbg.saveReceipt()" class="btn btn-success fw-bold w-100">
                    <i class="fas fa-file-signature me-1"></i>Simpan &amp; Tanda Tangan Digital Penerimaan Makanan
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/core/edu-store.js"></script>
<script src="assets/js/core/edu-fault-guard.js"></script>
<script src="assets/js/core/edu-student-lifecycle.js"></script>
<script src="assets/js/core/edu-login.js"></script>
<script src="assets/js/core/edu-auth.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/modules/mbg/index.js"></script>
<script>
    AtlasLayout.init('mbg');
    function _bootModule() {
        if (window.EduMbg && typeof EduMbg.openModule === 'function') {
            EduMbg.openModule();
        }
    }
    window.addEventListener('atlas:ready', _bootModule);
    document.addEventListener('DOMContentLoaded', _bootModule);
</script>
</body>
</html>
